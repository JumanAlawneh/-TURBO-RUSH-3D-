
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TURBO RUSH 3D</title>
<style>
*{box-sizing:border-box}
body{margin:0;overflow:hidden;background:#87ceeb;font-family:Arial,sans-serif;color:white}
canvas{display:block}
#hud{position:fixed;top:12px;left:12px;right:12px;display:flex;justify-content:space-between;gap:6px;pointer-events:none}
.panel{background:#101522df;padding:10px;border:1px solid #ffffff35;border-radius:12px}
.label{font-size:10px;color:#b9c4d8;letter-spacing:1px}
.value{font-size:19px;font-weight:bold;color:#ffd447;margin-top:4px}
#controls{position:fixed;bottom:20px;left:0;right:0;display:flex;justify-content:space-between;align-items:end;padding:0 15px;gap:8px}
.group{display:flex;gap:9px}
.ctrl{width:65px;height:65px;border-radius:17px;border:1px solid #ffffff70;background:#111827e8;color:white;font-size:26px;font-weight:bold;touch-action:none;user-select:none;-webkit-user-select:none}
.ctrl:active,.ctrl.active{background:#ffd447;color:#111}
#gas{height:78px;width:72px;background:#d4a51d;color:#171717}
#overlay{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#080e1bc9;padding:20px;text-align:center}
.dialog{max-width:430px;width:100%;padding:28px 22px;background:#111827ed;border:1px solid #f4c54280;border-radius:24px}
h1{font-size:clamp(32px,8vw,55px);margin:0;color:#ffd447;font-style:italic}
.dialog p{line-height:1.6;color:#d5dbea}
#start{padding:15px 30px;border:0;border-radius:12px;background:#ffd447;color:#151515;font-weight:bold;font-size:17px;cursor:pointer}
.small{font-size:12px;color:#aab4c7}
</style>
</head>
<body>

<div id="hud">
  <div class="panel"><div class="label">SPEED</div><div class="value"><span id="speed">0</span> KM/H</div></div>
  <div class="panel"><div class="label">DISTANCE</div><div class="value"><span id="distance">0</span> m</div></div>
  <div class="panel"><div class="label">SCORE</div><div class="value" id="score">0</div></div>
</div>

<div id="controls">
  <div class="group">
    <button class="ctrl" id="left">◀</button>
    <button class="ctrl" id="right">▶</button>
  </div>
  <div class="group">
    <button class="ctrl" id="brake">▼</button>
    <button class="ctrl" id="gas">▲</button>
  </div>
</div>

<div id="overlay">
  <div class="dialog">
    <h1>TURBO RUSH</h1>
    <p>3D STREET RACING</p>
    <p>Drive your car, dodge traffic and beat your high score!</p>
    <button id="start">START RACE</button>
    <p class="small">Use the screen buttons to drive.</p>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>
<script>
const scene=new THREE.Scene();
scene.background=new THREE.Color(0x87ceeb);
scene.fog=new THREE.Fog(0x87ceeb,40,170);

const camera=new THREE.PerspectiveCamera(65,innerWidth/innerHeight,0.1,250);
camera.position.set(0,5.5,10);

const renderer=new THREE.WebGLRenderer({antialias:true});
renderer.setSize(innerWidth,innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.shadowMap.enabled=true;
renderer.outputColorSpace=THREE.SRGBColorSpace;
document.body.prepend(renderer.domElement);

scene.add(new THREE.HemisphereLight(0xffffff,0x657080,2));
const sun=new THREE.DirectionalLight(0xffffff,3);
sun.position.set(-8,15,8);
sun.castShadow=true;
scene.add(sun);

function mat(color,roughness=0.7,metalness=0){
  return new THREE.MeshStandardMaterial({color,roughness,metalness});
}
function cube(parent,x,y,z,w,h,d,material){
  const mesh=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),material);
  mesh.position.set(x,y,z);
  mesh.castShadow=true;
  mesh.receiveShadow=true;
  parent.add(mesh);
  return mesh;
}

const grass=mat(0x43824c);
const road=mat(0x343943);
const white=mat(0xffffff);
const yellow=mat(0xffc629);
const tire=mat(0x161719);
const red=mat(0xc82032,0.3,0.35);
const glass=mat(0x9dd8ed,0.2,0.25);

const ground=new THREE.Mesh(new THREE.PlaneGeometry(300,300),grass);
ground.rotation.x=-Math.PI/2;
ground.position.y=-0.18;
scene.add(ground);

cube(scene,0,-0.05,-60,12,0.2,180,road);
for(const x of [-6.1,6.1])cube(scene,x,0.05,-60,0.18,0.25,180,white);

const markings=[];
for(let i=0;i<24;i++){
  for(const x of [-2,2]){
    markings.push(cube(scene,x,0.075,-i*7,0.12,0.025,3.2,yellow));
  }
}

// Player car
const car=new THREE.Group();
scene.add(car);
cube(car,0,0.52,0,1.65,0.48,3.05,red);
cube(car,0,0.88,-0.25,1.28,0.55,1.55,red);
cube(car,0,1.05,-0.18,1.12,0.38,1.25,glass);
cube(car,0,0.79,-1.48,1.9,0.12,0.25,tire);

for(const x of [-0.84,0.84]){
  for(const z of [-0.95,0.95]){
    const wheel=new THREE.Mesh(new THREE.CylinderGeometry(0.34,0.34,0.22,20),tire);
    wheel.rotation.z=Math.PI/2;
    wheel.position.set(x,0.36,z);
    car.add(wheel);
  }
}
for(const x of [-0.52,0.52]){
  cube(car,x,0.58,1.54,0.35,0.17,0.06,mat(0xff3434));
}
car.position.set(0,0,2);

// Other cars
const traffic=[];
function makeTraffic(z){
  const g=new THREE.Group();
  const colors=[0x1764d4,0xf3f3f3,0x20242d,0xe0a128,0x24a58a];
  const body=mat(colors[Math.floor(Math.random()*colors.length)],0.35,0.2);
  cube(g,0,0.48,0,1.5,0.45,2.5,body);
  cube(g,0,0.79,-0.2,1.12,0.4,1.2,glass);
  for(const x of [-0.78,0.78]){
    for(const zz of [-0.78,0.78]){
      const wheel=new THREE.Mesh(new THREE.CylinderGeometry(0.25,0.25,0.18,16),tire);
      wheel.rotation.z=Math.PI/2;
      wheel.position.set(x,0.3,zz);
      g.add(wheel);
    }
  }
  g.position.set([-4,0,4][Math.floor(Math.random()*3)],0,z);
  scene.add(g);
  traffic.push(g);
}
for(let i=0;i<9;i++)makeTraffic(-25-i*18);

// Trees
const trees=[];
const trunk=mat(0x70503a);
const leaves=mat(0x237243);
for(let i=0;i<36;i++){
  for(const side of [-1,1]){
    const tree=new THREE.Group();
    cube(tree,0,0.8,0,0.28,1.6,0.28,trunk);
    const crown=new THREE.Mesh(new THREE.ConeGeometry(1.05,2.5,7),leaves);
    crown.position.y=2.5;
    tree.add(crown);
    tree.position.set(side*(9+Math.random()*5),0,-i*9-8);
    scene.add(tree);
    trees.push(tree);
  }
}

// Game state
let running=false;
let speed=0;
let distance=0;
let score=0;
let steer=0;
let gas=false;
let brake=false;

const speedEl=document.getElementById('speed');
const distanceEl=document.getElementById('distance');
const scoreEl=document.getElementById('score');
const overlay=document.getElementById('overlay');

// Touch controls: track each button independently
const held={left:false,right:false,gas:false,brake:false};

function updateControls(){
  steer=(held.left?-1:0)+(held.right?1:0);
  gas=held.gas;
  brake=held.brake;
}

function bindButton(id,key){
  const el=document.getElementById(id);
  const press=e=>{
    e.preventDefault();
    held[key]=true;
    updateControls();
    el.classList.add('active');
    if(el.setPointerCapture && e.pointerId!==undefined){
      try{el.setPointerCapture(e.pointerId)}catch(_){}
    }
  };
  const release=e=>{
    if(e)e.preventDefault();
    held[key]=false;
    updateControls();
    el.classList.remove('active');
  };
  el.addEventListener('pointerdown',press);
  el.addEventListener('pointerup',release);
  el.addEventListener('pointercancel',release);
  el.addEventListener('lostpointercapture',release);
}

bindButton('left','left');
bindButton('right','right');
bindButton('gas','gas');
bindButton('brake','brake');

// Keyboard support
document.addEventListener('keydown',e=>{
  if(e.key==='ArrowLeft'||e.key.toLowerCase()==='a')held.left=true;
  if(e.key==='ArrowRight'||e.key.toLowerCase()==='d')held.right=true;
  if(e.key==='ArrowUp'||e.key.toLowerCase()==='w')held.gas=true;
  if(e.key==='ArrowDown'||e.key.toLowerCase()==='s')held.brake=true;
  updateControls();
});
document.addEventListener('keyup',e=>{
  if(e.key==='ArrowLeft'||e.key.toLowerCase()==='a')held.left=false;
  if(e.key==='ArrowRight'||e.key.toLowerCase()==='d')held.right=false;
  if(e.key==='ArrowUp'||e.key.toLowerCase()==='w')held.gas=false;
  if(e.key==='ArrowDown'||e.key.toLowerCase()==='s')held.brake=false;
  updateControls();
});
window.addEventListener('blur',()=>{
  Object.keys(held).forEach(k=>held[k]=false);
  updateControls();
});

function clearControls(){
  Object.keys(held).forEach(k=>held[k]=false);
  updateControls();
}

function endRace(message){
  running=false;
  speed=0;
  clearControls();
  overlay.style.display='flex';
  overlay.querySelector('h1').textContent=message;
  overlay.querySelector('p').textContent=
    'DISTANCE: '+Math.floor(distance)+' m | SCORE: '+score;
  document.getElementById('start').textContent='RACE AGAIN';
}

document.getElementById('start').addEventListener('click',()=>{
  speed=0;
  distance=0;
  score=0;
  car.position.x=0;

  traffic.forEach((t,i)=>{
    t.position.z=-25-i*18;
    t.position.x=[-4,0,4][Math.floor(Math.random()*3)];
  });

  clearControls();
  overlay.style.display='none';
  running=true;
});

// Animation
const clock=new THREE.Clock();

function animate(){
  requestAnimationFrame(animate);
  const dt=Math.min(clock.getDelta(),0.04);

  if(running){
    // Accelerate only while gas is pressed
    if(gas)speed=Math.min(speed+45*dt,190);
    else speed=Math.max(speed-35*dt,0);

    if(brake)speed=Math.max(speed-100*dt,0);

    // Steering works even when the car is stopped
    car.position.x+=steer*5*dt;
    car.position.x=Math.max(-4.7,Math.min(4.7,car.position.x));
    car.rotation.z=-steer*0.07;

    distance+=speed*dt/3.6;
    score=Math.floor(distance*2);

    // Move road markings
    markings.forEach(m=>{
      m.position.z+=speed*dt*0.65;
      if(m.position.z>7)m.position.z-=168;
    });

    // Move roadside trees
    trees.forEach(t=>{
      t.position.z+=speed*dt*0.65;
      if(t.position.z>10)t.position.z-=324;
    });

    // Move traffic
    traffic.forEach(t=>{
      t.position.z+=speed*dt*0.65;
      if(t.position.z>8){
        t.position.z=-140-Math.random()*40;
        t.position.x=[-4,0,4][Math.floor(Math.random()*3)];
      }

      const dx=Math.abs(t.position.x-car.position.x);
      const dz=Math.abs(t.position.z-car.position.z);
      if(dx<1.35&&dz<1.65)endRace('CRASH!');
    });

    speedEl.textContent=Math.round(speed);
    distanceEl.textContent=Math.floor(distance);
    scoreEl.textContent=score;
  }

  camera.position.x+=(car.position.x*0.45-camera.position.x)*0.12;
  camera.lookAt(car.position.x*0.35,0.7,-7);
  renderer.render(scene,camera);
}
animate();

addEventListener('resize',()=>{
  camera.aspect=innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth,innerHeight);
});
</script>
</body>
</html>
